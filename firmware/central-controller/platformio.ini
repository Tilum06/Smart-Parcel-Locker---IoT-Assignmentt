[platformio]
default_envs = central_yolo_uno_s3

[env:central_yolo_uno_s3]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261024
    platformio/framework-arduinoespressif32-esp32s3-libs@3.3.12

; Conservative profile supported by OhStem Boards 3.1.3 (see README).
; This S3 base is not a verified Yolo UNO variant: use numeric GPIOs only.
board_upload.flash_size = 4MB
board_upload.maximum_size = 1310720
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
; PSRAM stays disabled until the physical module/type is verified.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
